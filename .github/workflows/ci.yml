name: ci

on:
  push:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**']
    tags: ['**']
  pull_request:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**']

jobs:

  test:
    name: Erlang ${{ matrix.otp_version }} build
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        otp_version: [25, 26, 27, 28]

    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        rebar3-version: ${{ matrix.otp_version >= 26 && '3.25' || '3.22' }}
    - name: Check rebar3 Version
      run: rebar3 --version

    # These steps call the same make targets a developer runs locally, so a
    # green `make check` should mean green CI. Together they compose `make check`
    # (minus `clean`, which is unneeded on a fresh checkout). Keep this list in
    # sync with the `check` target in the Makefile.
    - name: Compile
      run: make compile
    - name: Xref
      run: make xref
    - name: Compile Examples
      run: make compile-examples
    - name: Dialyzer
      run: make dialyzer
    - name: Tests + Coverage (eunit, ct, proper, cover >=90%)
      run: make test
